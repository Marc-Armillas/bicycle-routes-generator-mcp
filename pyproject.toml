[project]
name = "mtb-routes"
version = "0.2.0"
description = "Generates mountain bike routes on real OpenStreetMap data and exports them as GPX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Marc Armillas" }]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "python-dotenv>=1.0",
]

[project.scripts]
mtb-routes = "mtb_routes.cli:main"
mtb-routes-mcp = "mtb_routes.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtb_routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that make real internet requests (disabled by default)"]
addopts = "-m 'not network'"
